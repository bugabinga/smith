# ADW self-test — deterministic checks for the MJS control plane.
name: adw-selftest

on:
  pull_request:
    paths:
      - 'adw/**'
      - '.claude/agents/**'
      - '.claude/skills/pioneer/SKILL.md'
      - '.github/workflows/adw-*.yml'
      - 'prototypes/p38-adw-disposable/wrappers/**'
  push:
    branches: [main]
    paths:
      - 'adw/**'
      - '.claude/agents/**'
      - '.claude/skills/pioneer/SKILL.md'
      - '.github/workflows/adw-*.yml'
      - 'prototypes/p38-adw-disposable/wrappers/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: MJS control-plane contracts
        run: node --test adw/test/*.test.mjs
