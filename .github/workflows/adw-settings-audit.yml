# ADW settings audit — read the repository configuration that no file in this
# repo can prove.
#
# Two blind spots cost hours on #112. First, `.github/rulesets/main.json` is the
# source of truth by convention only: it is applied through the UI by hand, so
# what actually guards `main` may differ from what the file says, and every
# diagnosis that trusts the file inherits the drift. Second, code scanning
# remembers configurations it has seen on the base branch; one that stops
# reporting goes stale rather than away, and a stale entry turns every PR's
# code-scanning check neutral — visible nowhere in Actions, because nothing
# fails.
#
# Strictly read-only. It prints what is; it changes nothing. Applying a ruleset
# or deleting a stale configuration stays the owner's, on purpose: an agent that
# could rewrite the rules judging it would undo what CODEOWNERS exists to
# enforce.
name: adw-settings-audit

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 6 * * 1"       # weekly — drift is slow, and this is a report

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5

      - name: Applied rulesets vs the file
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          {
            echo "## Rulesets actually applied to \`main\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Needs Administration: read. Say so plainly rather than failing with a
          # bare 403 — a missing scope and an empty ruleset list look identical
          # in the output otherwise.
          if ! rulesets=$(gh api "repos/$REPO/rulesets" 2>/dev/null); then
            echo "Could not read rulesets — the App is missing **Administration: read**." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # /rulesets lists everything defined on the repository, including
          # rulesets that target other refs or are disabled. Saying "N applied to
          # main" off that raw count would be the same kind of false confidence
          # this job exists to remove, so report the scope plainly and let the
          # per-ruleset target and enforcement below carry the truth.
          count=$(printf '%s' "$rulesets" | jq 'length')
          active=$(printf '%s' "$rulesets" | jq '[.[] | select(.enforcement == "active")] | length')
          {
            echo "$count ruleset(s) defined on the repository, $active active."
            echo "Scope is per-ruleset — read \`target\` and \`enforcement\` on each."
            echo "The repo file describes one."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          printf '%s' "$rulesets" | jq -r '.[] | "\(.id)\t\(.name)\t\(.target)\t\(.enforcement)"' \
          | while IFS=$'\t' read -r id name target enforcement; do
              {
                echo "### $name (id $id, $target, $enforcement)"
                echo '```json'
              } >> "$GITHUB_STEP_SUMMARY"
              gh api "repos/$REPO/rulesets/$id" \
                --jq '{rules: [.rules[] | {type, parameters}], bypass_actors}' \
                >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            done

          # The rule types the file claims, against the rule types actually live.
          # A type present in one and not the other is the drift worth seeing;
          # comparing full parameter trees would bury it in noise.
          #
          # Only rulesets that ACTUALLY govern the default branch may enter the
          # comparison. Unioning every defined ruleset would invent drift from a
          # disabled or other-branch rule, and — worse — could mask a missing
          # main rule behind an identical type defined elsewhere. Enforcement and
          # ref conditions are both part of "does this judge main".
          file_types=$(jq -r '[.rules[].type] | sort | join(", ")' .github/rulesets/main.json)
          # Ref conditions are glob patterns, and `~ALL` on a TAG ruleset governs
          # no branch at all. Matching three literal strings would both count
          # tag rules and miss `refs/heads/*`, so the patterns are matched as
          # globs and the target is checked.
          live_types=$(printf '%s' "$rulesets" \
            | jq -r '.[] | select(.enforcement == "active" and .target == "branch") | .id' \
            | while read -r id; do
                # Piped to a real jq: `gh api` accepts --jq but has no --arg, so
                # the ref has to be bound on this side of the pipe.
                gh api "repos/$REPO/rulesets/$id" \
                | jq -r --arg ref "refs/heads/$BRANCH" '
                  # GitHub matches refs with fnmatch, where `*` stops at a `/`
                  # and `**` crosses it. Mapping both to `.*` would report
                  # refs/heads/* as governing refs/heads/feature/x and overstate
                  # which rules apply. splits() on `**` rather than a placeholder
                  # string, because any placeholder can occur in a real pattern.
                  def globre: gsub("\\."; "\\\\.")
                    | [splits("\\*\\*")] | map(gsub("\\*"; "[^/]*")) | join(".*");
                  # $p is bound before the test: inside `$ref | test(...)` the
                  # dot would refer to $ref, so the pattern would compile to
                  # itself and match everything.
                  def matches($pats): any($pats[];
                    . as $p
                    | $p == "~ALL" or $p == "~DEFAULT_BRANCH" or
                      ($ref | test("^" + ($p | globre) + "$")));
                  if matches(.conditions.ref_name.include // [])
                     and (matches(.conditions.ref_name.exclude // []) | not)
                  then .rules[].type else empty end'
              done \
            | sort -u | paste -sd', ' -)
          [ -n "$live_types" ] || live_types="(none governing the default branch)"
          {
            echo "### Rule types"
            echo
            echo "| source | types |"
            echo "| --- | --- |"
            echo "| \`main.json\` | $file_types |"
            echo "| applied | $live_types |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Code scanning configurations, and which are stale
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          {
            echo
            echo "## Code scanning configurations on \`$BRANCH\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # --paginate, not a single page: the stale categories are by definition
          # the OLDEST analyses, so capping at the newest 100 would hide exactly
          # what this is looking for.
          if ! analyses=$(gh api --paginate --slurp \
                "repos/$REPO/code-scanning/analyses?ref=refs/heads/$BRANCH&per_page=100" \
                --jq 'add' 2>/dev/null); then
            echo "Could not read analyses — the App is missing **Code scanning alerts: read**." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # One row per category, newest analysis first. A category whose newest
          # analysis is old is the stale configuration GitHub still expects and
          # the workflow no longer produces — the thing that makes the PR check
          # neutral with "N configurations not found".
          {
            echo "| category | tool | latest analysis | age (days) |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          now=$(date -u +%s)
          printf '%s' "$analyses" \
          | jq -r 'group_by(.category)[] | max_by(.created_at)
                   | [(.category // "(none)"), .tool.name, .created_at] | @tsv' \
          | while IFS=$'\t' read -r category tool created; do
              age=$(( (now - $(date -u -d "$created" +%s)) / 86400 ))
              echo "| \`$category\` | $tool | $created | $age |" >> "$GITHUB_STEP_SUMMARY"
            done

          {
            echo
            echo "A category the current matrix no longer builds keeps its entry here."
            echo "That is the stale configuration: delete it at"
            echo "\`/security/code-scanning/tools\` — this job will not do it for you."
          } >> "$GITHUB_STEP_SUMMARY"
