name: ADW issue and reusable execution lanes
run-name: "${{ github.event_name == 'repository_dispatch' && github.event.client_payload.smith_operation_digest || format('ADW issue #{0}', github.event.issue.number) }}"
on:
  workflow_call:
    inputs:
      lane: {required: true, type: string}
      role: {required: true, type: string}
      primary: {required: true, type: string}
      fallback: {required: true, type: string}
      decision: {required: true, type: string}
      read_class: {required: true, type: string}
      control_sha: {required: true, type: string}
      target_sha: {required: true, type: string}
      target_repository: {required: true, type: string}
    secrets:
      APP_ID: {required: true}
      APP_PRIVATE_KEY: {required: true}
      CLAUDE_CODE_OAUTH_TOKEN: {required: true}
      CODEX_AUTH_JSON: {required: true}
  repository_dispatch:
    types: [retry_route, fallback_route, retry_pioneer]
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
permissions: {}
jobs:
  target:
    name: stage untrusted target data
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && ((inputs.lane != '' && inputs.control_sha == github.workflow_sha) || (inputs.lane == '' && github.workflow_sha == github.sha && ((github.event_name == 'repository_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.sender.id == fromJSON(vars.APP_BOT_USER_ID) && github.event.sender.login == vars.APP_BOT_LOGIN && github.event.sender.type == 'Bot') || (github.event_name == 'issues' && (github.event.action != 'labeled' || github.event.label.name == 'ready' || github.event.label.name == 'codex' || github.event.label.name == 'needs:prototype' || github.event.label.name == 'needs:breakdown')) || (github.event_name == 'issue_comment' && github.event.sender.id == github.event.repository.owner.id && github.event.sender.login == github.repository_owner && github.event.sender.type == 'User' && contains(format(' {0} ', github.event.comment.body), ' @smith ')))))
    permissions:
      contents: read
    steps:
      - name: checkout immutable target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: "${{ inputs.target_repository || github.repository }}", ref: "${{ inputs.target_sha || github.sha }}", path: target, fetch-depth: 0, persist-credentials: false}
      - name: bind exact transport ref
        env: {ADW_TARGET_SHA: "${{ inputs.target_sha || github.sha }}", GIT_CONFIG_NOSYSTEM: "1", GIT_CONFIG_GLOBAL: /dev/null, GIT_TERMINAL_PROMPT: "0", GIT_NO_REPLACE_OBJECTS: "1"}
        run: /usr/bin/git -c core.hooksPath=/dev/null -c credential.helper= -c protocol.file.allow=never -c core.fsmonitor=false -C "${{ github.workspace }}/target" update-ref --no-deref refs/heads/adw-target "$ADW_TARGET_SHA" && test "$(/usr/bin/git -c core.hooksPath=/dev/null -c credential.helper= -c protocol.file.allow=never -c core.fsmonitor=false -C "${{ github.workspace }}/target" rev-parse --verify 'refs/heads/adw-target^{commit}')" = "$ADW_TARGET_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-target, path: "${{ github.workspace }}/target", if-no-files-found: error, retention-days: 1, include-hidden-files: true, overwrite: true}
  prepare:
    name: prepare trusted issue or called lane
    needs: target
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && needs.target.result == 'success' && ((inputs.lane != '' && inputs.control_sha == github.workflow_sha) || (inputs.lane == '' && github.workflow_sha == github.sha && ((github.event_name == 'repository_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.sender.id == fromJSON(vars.APP_BOT_USER_ID) && github.event.sender.login == vars.APP_BOT_LOGIN && github.event.sender.type == 'Bot') || (github.event_name == 'issues' && (github.event.action != 'labeled' || github.event.label.name == 'ready' || github.event.label.name == 'codex' || github.event.label.name == 'needs:prototype' || github.event.label.name == 'needs:breakdown')) || (github.event_name == 'issue_comment' && github.event.sender.id == github.event.repository.owner.id && github.event.sender.login == github.repository_owner && github.event.sender.type == 'User' && contains(format(' {0} ', github.event.comment.body), ' @smith ')))))
    permissions:
      contents: read
    outputs:
      role: ${{ inputs.role || (github.event_name == 'repository_dispatch' && github.event.client_payload.role) || (github.event_name == 'issue_comment' && 'steerer') || (github.event.label.name == 'codex' && 'codex-builder') || (github.event.label.name == 'needs:prototype' && 'pioneer') || (github.event.label.name == 'needs:breakdown' && 'planner') || (github.event.label.name == 'ready' && 'builder') || 'triager' }}
      primary: ${{ inputs.primary || (github.event_name == 'repository_dispatch' && github.event.client_payload.provider) || (github.event.label.name == 'codex' && 'codex') || ((github.event_name == 'issues' && github.event.action != 'labeled') && 'codex') || 'claude' }}
      fallback: ${{ inputs.fallback || (github.event_name == 'repository_dispatch' && 'none') || (github.event.label.name == 'codex' && 'none') || ((github.event_name == 'issues' && github.event.action != 'labeled') && 'claude') || 'codex' }}
      decision: ${{ inputs.decision || 'reduce' }}
    steps:
      - name: checkout immutable control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ inputs.control_sha || github.workflow_sha }}", path: control, persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-target, path: "${{ github.workspace }}/target"}
      - name: mint exact read token
        id: prepare-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-actions: ${{ (inputs.read_class == 'prepare-pull' || inputs.read_class == 'prepare-maintenance') && 'read' || '' }}
          permission-administration: ${{ inputs.read_class == 'prepare-maintenance' && 'read' || '' }}
          permission-checks: ${{ (inputs.read_class == 'prepare-pull' || inputs.read_class == 'prepare-maintenance') && 'read' || '' }}
          permission-contents: read
          permission-issues: read
          permission-metadata: read
          permission-pull-requests: read
          permission-security-events: ${{ inputs.read_class == 'prepare-maintenance' && 'read' || '' }}
          permission-vulnerability-alerts: ${{ inputs.read_class == 'prepare-maintenance' && 'read' || '' }}
      - name: prepare bounded snapshot and source
        working-directory: ${{ github.workspace }}/control
        env:
          ADW_APP_ID: ${{ secrets.APP_ID }}
          ADW_APP_SLUG: ${{ steps.prepare-token.outputs.app-slug }}
          ADW_BOT_USER_ID: ${{ vars.APP_BOT_USER_ID }}
          ADW_BOT_LOGIN: ${{ vars.APP_BOT_LOGIN }}
          ADW_CONTROL_CHECKOUT: ${{ github.workspace }}/control
          ADW_TARGET_CHECKOUT: ${{ github.workspace }}/target
          ADW_SOURCE_ARTIFACT: ${{ github.workspace }}/source
          ADW_SNAPSHOT_ARTIFACT: ${{ github.workspace }}/output
          ADW_EVENT_PATH: ${{ github.event_path }}
          ADW_EVENT_NAME: ${{ github.event_name == 'pull_request_target' && 'pull_request' || github.event_name }}
          ADW_REPOSITORY: ${{ github.repository }}
          ADW_ROLE: ${{ inputs.role || (github.event_name == 'repository_dispatch' && github.event.client_payload.role) || (github.event_name == 'issue_comment' && 'steerer') || (github.event.label.name == 'codex' && 'codex-builder') || (github.event.label.name == 'needs:prototype' && 'pioneer') || (github.event.label.name == 'needs:breakdown' && 'planner') || (github.event.label.name == 'ready' && 'builder') || 'triager' }}
          ADW_CONTROL_SHA: ${{ inputs.control_sha || github.workflow_sha }}
          ADW_GH_PATH: /usr/bin/gh
          ADW_GIT_PATH: /usr/bin/git
          ADW_GITHUB_TOKEN: ${{ steps.prepare-token.outputs.token }}
          ADW_GITHUB_TOKEN_REPOSITORY: ${{ github.repository }}
          ADW_GITHUB_TOKEN_PERMISSIONS: ${{ inputs.read_class == 'prepare-maintenance' && '["actions:read","alerts:read","checks:read","contents:read","issues:read","pulls:read","repository:read","settings:read"]' || inputs.read_class == 'prepare-pull' && '["actions:read","checks:read","contents:read","issues:read","pulls:read","repository:read"]' || '["contents:read","issues:read","pulls:read","repository:read"]' }}
          ADW_GITHUB_TOKEN_EXPIRES_AT: job-scoped
        run: node adw/main.mjs prepare
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-source, path: "${{ github.workspace }}/source", if-no-files-found: error, retention-days: 1, include-hidden-files: true, overwrite: true}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-snapshot, path: "${{ github.workspace }}/output", if-no-files-found: error, retention-days: 1, include-hidden-files: true, overwrite: true}
  primary-claude:
    needs: prepare
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && needs.prepare.result == 'success' && needs.prepare.outputs.decision == 'reduce' && needs.prepare.outputs.primary == 'claude'
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_ASSESSMENT_ARTIFACT: "${{ github.workspace }}/output", ADW_TARGET_DIRECTORY: "${{ github.workspace }}/target", ADW_RUNNER_TEMP: "${{ runner.temp }}", ADW_NPM_PATH: /usr/local/bin/npm, ADW_GIT_PATH: /usr/bin/git, ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_PROVIDER_CREDENTIAL: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}", ADW_RUN_ID: "${{ github.run_id }}", ADW_JOB_ID: primary-claude, ADW_RUN_ATTEMPT: "${{ github.run_attempt }}", ADW_IDEMPOTENCY_KEY: "${{ github.run_id }}:claude:${{ needs.prepare.outputs.role }}"}
        run: node adw/main.mjs assess --provider claude
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-assessment-claude, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, overwrite: true}
  primary-codex:
    needs: prepare
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && needs.prepare.result == 'success' && needs.prepare.outputs.decision == 'reduce' && needs.prepare.outputs.primary == 'codex'
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_ASSESSMENT_ARTIFACT: "${{ github.workspace }}/output", ADW_TARGET_DIRECTORY: "${{ github.workspace }}/target", ADW_RUNNER_TEMP: "${{ runner.temp }}", ADW_NPM_PATH: /usr/local/bin/npm, ADW_GIT_PATH: /usr/bin/git, ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_PROVIDER_CREDENTIAL: "${{ secrets.CODEX_AUTH_JSON }}", ADW_RUN_ID: "${{ github.run_id }}", ADW_JOB_ID: primary-codex, ADW_RUN_ATTEMPT: "${{ github.run_attempt }}", ADW_IDEMPOTENCY_KEY: "${{ github.run_id }}:codex:${{ needs.prepare.outputs.role }}"}
        run: node adw/main.mjs assess --provider codex
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-assessment-codex, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, overwrite: true}
  fallback-claude:
    needs: [prepare, primary-codex]
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && always() && needs.prepare.result == 'success' && needs.prepare.outputs.fallback == 'claude' && needs.primary-codex.result != 'success'
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_ASSESSMENT_ARTIFACT: "${{ github.workspace }}/output", ADW_TARGET_DIRECTORY: "${{ github.workspace }}/target", ADW_RUNNER_TEMP: "${{ runner.temp }}", ADW_NPM_PATH: /usr/local/bin/npm, ADW_GIT_PATH: /usr/bin/git, ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_PROVIDER_CREDENTIAL: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}", ADW_RUN_ID: "${{ github.run_id }}", ADW_JOB_ID: fallback-claude, ADW_RUN_ATTEMPT: "${{ github.run_attempt }}", ADW_IDEMPOTENCY_KEY: "${{ github.run_id }}:claude:${{ needs.prepare.outputs.role }}"}
        run: node adw/main.mjs assess --provider claude
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-assessment-claude, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, overwrite: true}
  fallback-codex:
    needs: [prepare, primary-claude]
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && always() && needs.prepare.result == 'success' && needs.prepare.outputs.fallback == 'codex' && needs.primary-claude.result != 'success'
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_ASSESSMENT_ARTIFACT: "${{ github.workspace }}/output", ADW_TARGET_DIRECTORY: "${{ github.workspace }}/target", ADW_RUNNER_TEMP: "${{ runner.temp }}", ADW_NPM_PATH: /usr/local/bin/npm, ADW_GIT_PATH: /usr/bin/git, ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_PROVIDER_CREDENTIAL: "${{ secrets.CODEX_AUTH_JSON }}", ADW_RUN_ID: "${{ github.run_id }}", ADW_JOB_ID: fallback-codex, ADW_RUN_ATTEMPT: "${{ github.run_attempt }}", ADW_IDEMPOTENCY_KEY: "${{ github.run_id }}:codex:${{ needs.prepare.outputs.role }}"}
        run: node adw/main.mjs assess --provider codex
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-assessment-codex, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, overwrite: true}
  reduce:
    needs: [prepare, primary-claude, primary-codex, fallback-claude, fallback-codex]
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && always() && needs.prepare.result == 'success' && (needs.primary-claude.result != 'skipped' || needs.primary-codex.result != 'skipped')
    permissions: {}
    outputs: {apply_class: "${{ steps.decision.outputs.apply_class }}", apply_capabilities: "${{ steps.decision.outputs.apply_capabilities }}", apply_permissions: "${{ steps.decision.outputs.apply_permissions }}", permission_actions: "${{ steps.decision.outputs.permission_actions }}", permission_administration: "${{ steps.decision.outputs.permission_administration }}", permission_checks: "${{ steps.decision.outputs.permission_checks }}", permission_contents: "${{ steps.decision.outputs.permission_contents }}", permission_issues: "${{ steps.decision.outputs.permission_issues }}", permission_metadata: "${{ steps.decision.outputs.permission_metadata }}", permission_pull_requests: "${{ steps.decision.outputs.permission_pull_requests }}", permission_security_events: "${{ steps.decision.outputs.permission_security_events }}", permission_vulnerability_alerts: "${{ steps.decision.outputs.permission_vulnerability_alerts }}"}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - id: decision
        working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_PRIMARY_ASSESSMENT_ARTIFACT: "${{ needs.primary-claude.result != 'skipped' && format('{0}/transport/adw-assessment-claude', github.workspace) || format('{0}/transport/adw-assessment-codex', github.workspace) }}", ADW_FALLBACK_ASSESSMENT_ARTIFACT: "${{ needs.primary-claude.result != 'skipped' && format('{0}/transport/adw-assessment-codex', github.workspace) || format('{0}/transport/adw-assessment-claude', github.workspace) }}", ADW_FALLBACK_ATTEMPTED: "${{ needs.fallback-claude.result != 'skipped' || needs.fallback-codex.result != 'skipped' }}", ADW_DECISION_ARTIFACT: "${{ github.workspace }}/output", ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_EMIT_GITHUB_OUTPUT: exact-permissions-v1}
        run: node adw/main.mjs reduce
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-decision, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, include-hidden-files: true, overwrite: true}
  reconcile:
    needs: prepare
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && needs.prepare.result == 'success' && needs.prepare.outputs.decision == 'reconcile'
    permissions:
      contents: read
    outputs: {apply_class: "${{ steps.decision.outputs.apply_class }}", apply_capabilities: "${{ steps.decision.outputs.apply_capabilities }}", apply_permissions: "${{ steps.decision.outputs.apply_permissions }}", permission_actions: "${{ steps.decision.outputs.permission_actions }}", permission_administration: "${{ steps.decision.outputs.permission_administration }}", permission_checks: "${{ steps.decision.outputs.permission_checks }}", permission_contents: "${{ steps.decision.outputs.permission_contents }}", permission_issues: "${{ steps.decision.outputs.permission_issues }}", permission_metadata: "${{ steps.decision.outputs.permission_metadata }}", permission_pull_requests: "${{ steps.decision.outputs.permission_pull_requests }}", permission_security_events: "${{ steps.decision.outputs.permission_security_events }}", permission_vulnerability_alerts: "${{ steps.decision.outputs.permission_vulnerability_alerts }}"}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - id: decision
        working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_DECISION_ARTIFACT: "${{ github.workspace }}/output", ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_EMIT_GITHUB_OUTPUT: exact-permissions-v1}
        run: node adw/main.mjs reconcile
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-decision, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, include-hidden-files: true, overwrite: true}
  audit:
    needs: prepare
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && needs.prepare.result == 'success' && needs.prepare.outputs.decision == 'audit'
    permissions:
      contents: read
    outputs: {apply_class: "${{ steps.decision.outputs.apply_class }}", apply_capabilities: "${{ steps.decision.outputs.apply_capabilities }}", apply_permissions: "${{ steps.decision.outputs.apply_permissions }}", permission_actions: "${{ steps.decision.outputs.permission_actions }}", permission_administration: "${{ steps.decision.outputs.permission_administration }}", permission_checks: "${{ steps.decision.outputs.permission_checks }}", permission_contents: "${{ steps.decision.outputs.permission_contents }}", permission_issues: "${{ steps.decision.outputs.permission_issues }}", permission_metadata: "${{ steps.decision.outputs.permission_metadata }}", permission_pull_requests: "${{ steps.decision.outputs.permission_pull_requests }}", permission_security_events: "${{ steps.decision.outputs.permission_security_events }}", permission_vulnerability_alerts: "${{ steps.decision.outputs.permission_vulnerability_alerts }}"}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - id: decision
        working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_DECISION_ARTIFACT: "${{ github.workspace }}/output", ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}", ADW_EMIT_GITHUB_OUTPUT: exact-permissions-v1}
        run: node adw/main.mjs audit
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-decision, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, include-hidden-files: true, overwrite: true}
  verify:
    needs: [prepare, reduce, reconcile, audit]
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && always() && needs.prepare.result == 'success'
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - working-directory: ${{ github.workspace }}/source/control
        env: {ADW_SOURCE_ARTIFACT: "${{ github.workspace }}/source", ADW_SNAPSHOT_ARTIFACT: "${{ github.workspace }}/transport/adw-snapshot", ADW_DECISION_ARTIFACT: "${{ github.workspace }}/transport/adw-decision", ADW_VERIFICATION_ARTIFACT: "${{ github.workspace }}/output", ADW_TARGET_DIRECTORY: "${{ github.workspace }}/target", ADW_TEMPORARY_DIRECTORY: "${{ runner.temp }}", ADW_GIT_PATH: /usr/bin/git, ADW_CONTROL_SHA: "${{ inputs.control_sha || github.workflow_sha }}"}
        run: node adw/main.mjs verify
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: adw-verification, path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, include-hidden-files: true, overwrite: true}
  apply:
    needs: [prepare, reduce, reconcile, audit, verify]
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && always() && needs.prepare.result == 'success'
    permissions:
      contents: read
    concurrency: {group: adw-write, cancel-in-progress: false}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-*, path: "${{ github.workspace }}/transport"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: adw-source, path: "${{ github.workspace }}/source"}
      - name: download prior apply receipts
        if: github.run_attempt > 1
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {pattern: adw-apply-result-*, path: "${{ github.workspace }}/previous-apply-results"}
      - name: mint exact operation-class token
        id: apply-token
        if: needs.verify.result == 'success' && (needs.reduce.outputs.apply_class != 'none' && needs.reduce.outputs.apply_class != '' || needs.reconcile.outputs.apply_class != 'none' && needs.reconcile.outputs.apply_class != '' || needs.audit.outputs.apply_class != 'none' && needs.audit.outputs.apply_class != '')
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-actions: ${{ needs.reduce.outputs.permission_actions || needs.reconcile.outputs.permission_actions || needs.audit.outputs.permission_actions }}
          permission-administration: ${{ needs.reduce.outputs.permission_administration || needs.reconcile.outputs.permission_administration || needs.audit.outputs.permission_administration }}
          permission-checks: ${{ needs.reduce.outputs.permission_checks || needs.reconcile.outputs.permission_checks || needs.audit.outputs.permission_checks }}
          permission-contents: ${{ needs.reduce.outputs.permission_contents || needs.reconcile.outputs.permission_contents || needs.audit.outputs.permission_contents }}
          permission-issues: ${{ needs.reduce.outputs.permission_issues || needs.reconcile.outputs.permission_issues || needs.audit.outputs.permission_issues }}
          permission-metadata: ${{ needs.reduce.outputs.permission_metadata || needs.reconcile.outputs.permission_metadata || needs.audit.outputs.permission_metadata }}
          permission-pull-requests: ${{ needs.reduce.outputs.permission_pull_requests || needs.reconcile.outputs.permission_pull_requests || needs.audit.outputs.permission_pull_requests }}
          permission-security-events: ${{ needs.reduce.outputs.permission_security_events || needs.reconcile.outputs.permission_security_events || needs.audit.outputs.permission_security_events }}
          permission-vulnerability-alerts: ${{ needs.reduce.outputs.permission_vulnerability_alerts || needs.reconcile.outputs.permission_vulnerability_alerts || needs.audit.outputs.permission_vulnerability_alerts }}
      - working-directory: ${{ github.workspace }}/source/control
        env:
          ADW_SOURCE_ARTIFACT: ${{ github.workspace }}/source
          ADW_SNAPSHOT_ARTIFACT: ${{ github.workspace }}/transport/adw-snapshot
          ADW_DECISION_ARTIFACT: ${{ github.workspace }}/transport/adw-decision
          ADW_VERIFICATION_ARTIFACT: ${{ github.workspace }}/transport/adw-verification
          ADW_APPLY_RESULT_ARTIFACT: ${{ github.workspace }}/output
          ADW_PREVIOUS_APPLY_RESULTS_ROOT: ${{ github.workspace }}/previous-apply-results
          ADW_RUN_ATTEMPT: ${{ github.run_attempt }}
          ADW_REPOSITORY: ${{ github.repository }}
          ADW_CONTROL_SHA: ${{ inputs.control_sha || github.workflow_sha }}
          ADW_TARGET_DIRECTORY: ${{ github.workspace }}/target
          ADW_TEMPORARY_DIRECTORY: ${{ runner.temp }}
          ADW_GIT_PATH: /usr/bin/git
          ADW_GH_PATH: /usr/bin/gh
          ADW_APP_ID: ${{ secrets.APP_ID }}
          ADW_APP_SLUG: ${{ steps.apply-token.outputs.app-slug }}
          ADW_BOT_USER_ID: ${{ vars.APP_BOT_USER_ID }}
          ADW_BOT_LOGIN: ${{ vars.APP_BOT_LOGIN }}
          ADW_GITHUB_TOKEN: ${{ steps.apply-token.outputs.token }}
          ADW_GITHUB_TOKEN_REPOSITORY: ${{ steps.apply-token.outputs.token && github.repository || '' }}
          ADW_GITHUB_TOKEN_PERMISSIONS: ${{ steps.apply-token.outputs.token && (needs.reduce.outputs.apply_capabilities || needs.reconcile.outputs.apply_capabilities || needs.audit.outputs.apply_capabilities) || '' }}
          ADW_GITHUB_TOKEN_EXPIRES_AT: ${{ steps.apply-token.outputs.token && 'job-scoped' || '' }}
        run: node adw/main.mjs apply
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: "adw-apply-result-${{ github.run_attempt }}", path: "${{ github.workspace }}/output", if-no-files-found: ignore, retention-days: 1, include-hidden-files: true}
  evidence:
    needs: [prepare, apply]
    runs-on: ubuntu-24.04
    if: vars.ADW_MJS_CUTOVER_HOLD != 'true' && always() && needs.prepare.result == 'success' && needs.apply.result != 'skipped'
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: "adw-apply-result-${{ github.run_attempt }}", path: "${{ github.workspace }}/evidence/adw-apply-result"}
