# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

# Runs on EVERY push and pull request, with no path filter. Skipping a scan on a
# docs-only PR saved a minute of runner time and cost far more than that: code
# scanning compares a PR against the configurations present on the base branch,
# and a configuration that produces no analysis — because the workflow was
# path-skipped, or because the language left the matrix — is "not found" rather
# than "fine". The check then goes NEUTRAL, which is not a failure and so appears
# nowhere as one. Every configuration must report on every pull request.
#
# The weekly schedule stays as the full-tree backstop.
#
# The header used to argue this was safe "because CodeQL is not a required merge
# check; only `merge-gate` is". Whatever the ruleset requires, dropping a
# language has a cost this missed: code scanning remembers the configurations it
# has seen on the base branch, and one that stops reporting does not disappear —
# it goes STALE. GitHub then cannot diff a PR's alerts against a baseline, and
# posts "Code scanning results / CodeQL — N configurations not found" as a
# NEUTRAL check. #112 sat with every verdict in and merge-gate green, showing
# "All checks have passed" and "Unable to merge — some checks did not pass" in
# the same view.
#
# Stale configurations are cleared from the repository's code-scanning tool
# status page, not from this file. The deadlock the RE-ADD CHECKLIST below warns
# about is therefore not only a risk when ADDING a language — REMOVING one arms
# it too, and the cleanup does not live in this repository. Any change to the
# matrix must be paired with a look at that page.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '27 23 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        # `actions` covers the ADW's own workflows, and is deliberately the only
        # entry. The stale `language:rust` configuration that wedged #112 was
        # deleted on the tool status page rather than revived here: the seven
        # production crates are 34 lines of stubs, and the original reason for
        # dropping rust — a scan with nothing to analyse fails — is not clearly
        # retired by stubs. Re-adding it on that evidence risked a red scan on
        # every PR, which is the same deadlock from the other side.
        #
        # RE-ADD CHECKLIST (as of 2026-07-25):
        #   - The crates carry real code → add `- language: rust` with
        #     `build-mode: none` (the Rust extractor is source-based, so the
        #     workspace need not compile), and confirm the scan is green on main
        #     BEFORE relying on it.
        #   - `site/` (Astro) lands → add `- language: javascript-typescript`.
        #     Note its extractor only partially parses `.astro` SFCs (embedded
        #     JS, not the template DSL); DevSkim + npm-audit/Dependabot carry the
        #     site's real coverage.
        #   - Adding OR removing a language changes the set of configurations
        #     code scanning expects. A removed one goes stale rather than away,
        #     and a stale configuration makes every PR's code-scanning check
        #     neutral until it is deleted on the tool status page. Do that in the
        #     same change that edits this matrix. See #116, #17.
        - language: actions
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # prototypes/ is disposable spec-validation code (SPEC §18) — keep it out
        # of the scan so findings track only production source.
        config: |
          paths-ignore:
            - 'prototypes/**'
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
