# ADW review — reviewer (correctness) + security-reviewer (security) run on every
# PR in parallel. Verdicts only; neither merges. reviewer runs a different model
# than the builder on purpose. Each posts a terse comment and applies its verdict
# directly as a label the merge-gate reads (`reviewed` / `changes-requested`,
# `security-cleared` / `risk:high`). Full tool access — bounded by the agent
# charters (.claude/agents/*.md), not an allow-list.
#
# The reset job strips stale verdict labels first (except sticky `risk:high`), so
# a new push can't inherit a prior review's pass — the reviewers re-earn it on the
# current head.
#
# Each reviewer's contract is its LABEL, not its exit code. A model can return a
# clean success having called no tool and said nothing, which GitHub then records
# as a passed mission-critical gate; seen on #77, where the security job went
# green in 18.8s over two turns with no comment and no verdict. So every review
# job asserts that it actually labelled, and fails loudly when it didn't — a
# silent skip becomes a red check the rest of the machinery can already escalate.
name: adw-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: adw-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Strip stale verdict labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # risk:high is deliberately NOT stripped: once security-reviewer
          # escalates, only the owner de-escalates it.
          stripped="reviewed security-cleared changes-requested stalled"
          for l in $stripped; do
            # Removing an absent label errors, which is why failures are ignored
            # here — but that also swallows a genuine API failure, and a verdict
            # that survives the reset is a previous head's judgement standing in
            # for this one.
            gh pr edit "$PR" --repo "$REPO" --remove-label "$l" 2>/dev/null || true
          done
          # So verify rather than assume. The reviewers depend on this job, so
          # failing here stops them running and leaves the gate red — a stale
          # verdict never gets the chance to authorise the new head.
          # -e is off so an absent-label removal above can fail harmlessly, which
          # means this read must be checked by hand: an unchecked failure leaves
          # `remaining` empty and reports "cleared" on no evidence at all.
          if ! remaining=$(gh pr view "$PR" --repo "$REPO" --json labels \
                             -q '[.labels[].name] | join(",")'); then
            echo "::error::could not read labels to confirm the reset"
            exit 1
          fi
          csv=",$remaining,"
          survived=""
          for l in $stripped; do
            case "$csv" in *",$l,"*) survived="$survived $l";; esac
          done
          if [ -n "$survived" ]; then
            echo "::error::reset failed to strip:$survived — refusing to let a"\
                 "previous head's verdict stand for this one"
            exit 1
          fi
          echo "verdict labels cleared for the new head"

  reviewer:
    needs: reset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Mark the start of this review
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.token.outputs.token }}
          allowed_bots: agent-smith-bugabinga-adc
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the reviewer subagent to review PR
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/agents/reviewer.md: adversarial correctness review vs
            the spec, craft lenses. Do not merge.
            Post ONE terse PR comment: findings as one-line bullets (file:line —
            the defect), most severe first, no preamble/praise/restating; a clean
            pass is one line. The comment's FIRST LINE must begin with exactly
            `Review: ${{ github.event.pull_request.head.sha }}` — the workflow
            proves this job reviewed THIS commit by finding that prefix and that
            sha, and a comment without both reads as if you never posted.
            Then apply your verdict as a label: on approve add
            `reviewed` and remove `changes-requested`; on request-changes add
            `changes-requested` and remove `reviewed`.
            You are a mission-critical gate.
          claude_args: --model claude-opus-4-8 --effort xhigh --dangerously-skip-permissions
      - name: Assert a verdict was cast
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: "Review:"
          REVIEW_BOT: "agent-smith-bugabinga-adc[bot]"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '[.labels[].name] | join(",")')
          case ",$labels," in
            *,reviewed,*|*,changes-requested,*) ;;
            *)
              echo "::error::reviewer ended without a verdict label (have: [$labels]);"\
                   "expected reviewed or changes-requested"
              exit 1 ;;
          esac
          # A label can outlive the run that set it, so label presence alone
          # cannot prove this run did anything. The charter requires one comment
          # per review, so a comment newer than the job start is the evidence —
          # but it must be THIS job's comment. reviewer and security-reviewer run
          # in parallel under one App identity, so author cannot separate them
          # and a bare recency count is satisfied by the sibling's post. The
          # marker names the job and the head sha names the commit, so no earlier
          # run can satisfy it however the clocks fall — a second-resolution
          # timestamp alone could be tied by a cancelled run's last comment.
          # ISO-8601 sorts lexically, which is all the date comparison needs.
          posted=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                     --jq '.[] | [.created_at, .user.login, (.body | split("\n")[0])] | @tsv' \
                   | awk -F'\t' -v t="$REVIEW_STARTED_AT" -v m="$MARKER" -v b="$REVIEW_BOT" \
                         -v sha="$HEAD_SHA" \
                       '$2 == b && $1 >= t && index($3, m) == 1 && index($3, sha) > 0' | wc -l)
          if [ "$posted" -eq 0 ]; then
            echo "::error::reviewer posted no '$MARKER' comment for $HEAD_SHA"\
                 "this run; the verdict label is stale, not earned"
            exit 1
          fi
          echo "verdict cast and $posted '$MARKER' comment(s) posted — labels: [$labels]"

  security-reviewer:
    needs: reset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Mark the start of this review
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.token.outputs.token }}
          allowed_bots: agent-smith-bugabinga-adc
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Use the security-reviewer subagent to review PR
            #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow .claude/agents/security-reviewer.md: sandbox, secrets, unsafe,
            injection, supply chain. Do not merge.
            Post ONE terse PR comment: only real findings as one-line bullets
            (file:line — the risk), most severe first; a clean pass is one line.
            The comment's FIRST LINE must begin with exactly
            `Security review: ${{ github.event.pull_request.head.sha }}` — the
            workflow proves this job reviewed THIS commit by finding that prefix
            and that sha, and a comment without both reads as if you never posted.
            Then apply your verdict: if nothing high-severity add `security-cleared`;
            on a high finding add `risk:high` and ensure `security-cleared` is
            absent (holds the merge for the owner).
            You are a mission-critical gate.
          claude_args: --model claude-opus-4-8 --effort high --dangerously-skip-permissions
      - name: Assert a verdict was cast
        if: always()
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          MARKER: "Security review:"
          REVIEW_BOT: "agent-smith-bugabinga-adc[bot]"
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          labels=$(gh pr view "$PR" --repo "$REPO" --json labels -q '[.labels[].name] | join(",")')
          case ",$labels," in
            *,security-cleared,*|*,risk:high,*) ;;
            *)
              echo "::error::security-reviewer ended without a verdict label (have: [$labels]);"\
                   "expected security-cleared or risk:high"
              exit 1 ;;
          esac
          # `risk:high` deliberately survives the reset, so on this path the
          # label check alone is satisfiable by a sticky label from an earlier
          # run — a no-op review would pass green, which is exactly the bug this
          # assertion exists to catch. The evidence must therefore be this job's
          # own comment: both reviewers post under one App identity and run in
          # parallel, so a bare recency count would accept the sibling's comment
          # and leave the hole open on precisely the path that needs it closed.
          posted=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                     --jq '.[] | [.created_at, .user.login, (.body | split("\n")[0])] | @tsv' \
                   | awk -F'\t' -v t="$REVIEW_STARTED_AT" -v m="$MARKER" -v b="$REVIEW_BOT" \
                         -v sha="$HEAD_SHA" \
                       '$2 == b && $1 >= t && index($3, m) == 1 && index($3, sha) > 0' | wc -l)
          if [ "$posted" -eq 0 ]; then
            echo "::error::security-reviewer posted no '$MARKER' comment for"\
                 "$HEAD_SHA this run; the verdict label is stale, not earned"
            exit 1
          fi
          echo "verdict cast and $posted '$MARKER' comment(s) posted — labels: [$labels]"
