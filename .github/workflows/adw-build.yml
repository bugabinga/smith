# ADW build — builder implements an issue once it is labeled `ready`.
# issue/PR agent → claude-code-action (which handles `issues` events; the CLI
# path is only needed for push/schedule/tag, see p35). Runs as the App so its PR
# cascades into review. Phase 1 posture: opens a PR, never merges.
# Commits are signed via the App token (use_commit_signing) so they land Verified.
# Needs secrets APP_ID, APP_PRIVATE_KEY, CLAUDE_CODE_OAUTH_TOKEN.
name: adw-build

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: adw-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    # `ready` routes to the Claude builder; `codex` routes to adw-codex-build.
    # Guard against both landing on one issue — Codex wins, Claude stands down.
    if: >-
      github.event.label.name == 'ready' &&
      !contains(github.event.issue.labels.*.name, 'codex')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Create the Claude issue branch
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="claude/issue-${ISSUE}"
          if ! gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            sha=$(gh api "repos/$REPO/git/ref/heads/main" -q .object.sha)
            gh api --method POST "repos/$REPO/git/refs" \
              -f "ref=refs/heads/$branch" -f "sha=$sha"
          fi
          git fetch origin "$branch:refs/remotes/origin/$branch"
          git checkout --track "origin/$branch"
      - id: claude
        continue-on-error: true
        timeout-minutes: 15
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b
        env:
          CLAUDE_BRANCH: "claude/issue-${{ github.event.issue.number }}"
        with:
          github_token: ${{ steps.token.outputs.token }}
          allowed_bots: agent-smith-bugabinga-adc
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_commit_signing: true
          prompt: |
            Use the builder subagent to implement issue
            #${{ github.event.issue.number }} in ${{ github.repository }}.
            Follow .claude/agents/builder.md exactly — it defines the TWO kinds
            of issue. A product slice: one slice per WALKING-SKELETON, with
            tests. An ADW/config work-order: make exactly the change it
            specifies (a missing test or absent workspace is not a reason to
            no-op). Self-harden with /sabotnik and /handmade, open a PR that closes the issue.
            You are the UI/UX builder — take UI/TUI/frontend
            slices; the Codex builder owns backend. Do not merge. If you cannot
            build it, say why in one line instead of producing nothing.
          claude_args: --model claude-opus-4-8 --effort high --dangerously-skip-permissions
      - name: Route a missing Claude artifact to Codex
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
        run: |
          branch="claude/issue-${ISSUE}"
          state=$(gh issue view "$ISSUE" --repo "$REPO" --json state,labels \
                    --jq '[.state, ([.labels[].name] | join(","))] | @tsv')
          IFS=$'\t' read -r issue_state labels <<< "$state"
          [ "$issue_state" = OPEN ] || exit 0
          case ",$labels," in *,ready,*) ;; *) exit 0 ;; esac
          case ",$labels," in *,codex,*|*,blocked,*|*,needs:info,*|*,needs:spec,*|*,needs:prototype,*|*,needs:breakdown,*|*,risk:high,*) exit 0 ;; esac
          owner=${REPO%%/*}
          numbers=$(gh api --method GET "repos/$REPO/pulls" -f state=open \
                    -f "head=$owner:$branch" --jq '.[].number')
          prs=0
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            qualifies=$(gh pr view "$number" --repo "$REPO" --json baseRefName,closingIssuesReferences \
                        -q '.baseRefName == "main" and any(.closingIssuesReferences[]; .number == '"$ISSUE"')')
            if [ "$qualifies" = true ]; then
              prs=1
              break
            fi
          done <<< "$numbers"
          [ "$prs" -eq 0 ] || exit 0
          next_labels=$(gh issue view "$ISSUE" --repo "$REPO" --json labels \
                        -q '[.labels[].name | select(. != "ready")] + ["fallback:claude", "codex"] | unique')
          gh api --method PATCH "repos/$REPO/issues/$ISSUE" --input - \
            <<< "{\"labels\":$next_labels}"
          gh issue comment "$ISSUE" --repo "$REPO" --body "Claude produced no open PR (${CLAUDE_OUTCOME}); routed once to Codex fallback."
