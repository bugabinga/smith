[workspace]
members = [
    "smith",
    "smith-core",
    "smith-ai",
    "smith-tui",
    "smith-harness",
    "smith-cli",
    "xtask",
]
# Prototypes are disposable spec-validation crates (SPEC §18) with their own
# locked dependencies, deliberately outside the product build. Without this,
# Cargo sees a package inside the workspace directory that is neither a member
# nor excluded and refuses to build it at all — which is what happened the
# moment this workspace landed: all 28 prototypes stopped compiling, and the
# guard that would have said so was pointed at a branch that no longer existed.
exclude = ["prototypes"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

# Versions are quoted from the SPEC §2.3 canonical dependency registry, which is
# the only place a crate may be added or removed. Entries appear here as the
# slices that need them land, so this table is a subset of the registry and
# never a superset — a name absent from §2.3 must not appear below.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
futures = "0.3"
thiserror = "2"
ciborium = "0.2"

# The lint wall. It lives here, not in .cargo/config.toml rustflags, because a
# [target.*] rustflags key REPLACES [build].rustflags rather than merging — so a
# per-target stanza silently disabled every lint below for that target alone.
# Cargo lint tables are per-crate and target-independent, and they apply only to
# workspace crates rather than leaking -D warnings into dependencies.
[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.lints.rustdoc]
missing_crate_level_docs = "deny"
broken_intra_doc_links = "deny"
invalid_html_tags = "warn"
bare_urls = "warn"

# Mandated verbatim by SPEC §3 and PROJECT-INVARIANTS §8a. No debug info in
# release builds; debug symbols come only from the default dev profile.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.release.package."*"]
opt-level = 3
