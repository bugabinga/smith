name: ADW maintenance triggers
run-name: ADW maintenance ${{ github.event_name == 'schedule' && github.event.schedule || github.event_name }}
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 */6 * * *'
    - cron: '17 2 * * *'
    - cron: '27 2 * * 1'
    - cron: '37 2 * * *'
    - cron: '47 2 * * 1'
    - cron: '57 2 * * *'
  dependabot_alert:
    types: [created, reintroduced, reopened]
  code_scanning_alert:
    types: [created, reopened]
  workflow_dispatch:
    inputs:
      lane: {description: settings, required: true, type: choice, options: [audit]}
permissions: {}
jobs:
  maintenance-event-lane:
    name: reconciliation, planning, audit, labels, or alert lane
    permissions:
      contents: read
    uses: ./.github/workflows/adw-issues.yml
    with:
      lane: ${{ github.event_name == 'workflow_dispatch' && 'maintenance-audit' || github.event.schedule == '7 */6 * * *' && 'maintenance-reconcile' || github.event.schedule == '17 2 * * *' && 'maintenance-audit' || github.event.schedule == '27 2 * * 1' && 'maintenance-survey' || github.event.schedule == '37 2 * * *' && 'maintenance-sweep' || github.event.schedule == '47 2 * * 1' && 'maintenance-doctor' || endsWith(github.event_name, '_alert') && 'maintenance-alert' || 'maintenance-plan' }}
      role: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *') && 'auditor' || github.event.schedule == '7 */6 * * *' && 'reconciler' || github.event.schedule == '27 2 * * 1' && 'surveyor' || github.event.schedule == '37 2 * * *' && 'sweeper' || github.event.schedule == '47 2 * * 1' && 'adw-doctor' || (github.event.schedule == '57 2 * * *' || endsWith(github.event_name, '_alert')) && 'alert-triager' || 'planner' }}
      primary: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *' || github.event.schedule == '7 */6 * * *') && 'none' || (github.event.schedule == '37 2 * * *' || github.event.schedule == '47 2 * * 1') && 'codex' || 'claude' }}
      fallback: ${{ (github.event_name == 'workflow_dispatch' || github.event.schedule == '17 2 * * *' || github.event.schedule == '7 */6 * * *' || github.event.schedule == '37 2 * * *') && 'none' || github.event.schedule == '47 2 * * 1' && 'claude' || 'codex' }}
      decision: ${{ github.event_name == 'workflow_dispatch' && 'audit' || github.event.schedule == '17 2 * * *' && 'audit' || github.event.schedule == '7 */6 * * *' && 'reconcile' || 'reduce' }}
      read_class: prepare-maintenance
      control_sha: ${{ github.sha }}
      target_sha: ${{ github.sha }}
      target_repository: ${{ github.repository }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
