name: ADW pull and reconcile triggers
run-name: ADW pull ${{ github.event_name }} ${{ github.event.action }}
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
permissions: {}
jobs:
  pull-event-lane:
    name: pull provider or reconcile-only lane
    permissions:
      contents: read
    uses: ./.github/workflows/adw-issues.yml
    with:
      lane: ${{ (github.event_name == 'pull_request_review_comment' || startsWith(github.event_name, 'check_')) && 'pull-reconcile' || github.event_name == 'pull_request_review' && 'pull-revision' || 'pull-provider' }}
      role: ${{ (github.event_name == 'pull_request_review_comment' || startsWith(github.event_name, 'check_')) && 'reconciler' || (github.event.pull_request.head.repo.full_name != github.repository && 'reviewer') || github.event_name == 'pull_request_review' && 'reviser' || (github.event.pull_request.merged == true && 'docs-writer') || (github.event.pull_request.user.login == 'dependabot[bot]' && 'dependency-manager') || (github.event.label.name == 'changes-requested' && 'reviser') || (github.event.label.name == 'reviewed' && 'security-reviewer') || 'reviewer' }}
      primary: ${{ (github.event_name == 'pull_request_review_comment' || startsWith(github.event_name, 'check_')) && 'none' || ((github.event.pull_request.merged == true || github.event.pull_request.user.login == 'dependabot[bot]') && 'codex') || 'claude' }}
      fallback: ${{ (github.event_name == 'pull_request_review_comment' || startsWith(github.event_name, 'check_')) && 'none' || ((github.event.pull_request.merged == true || github.event.pull_request.user.login == 'dependabot[bot]') && 'claude') || 'codex' }}
      decision: ${{ (github.event_name == 'pull_request_review_comment' || startsWith(github.event_name, 'check_')) && 'reconcile' || 'reduce' }}
      read_class: prepare-pull
      control_sha: ${{ github.event.pull_request.base.sha || github.event.check_run.pull_requests[0].base.sha || github.event.check_suite.pull_requests[0].base.sha || github.sha }}
      target_sha: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha || github.event.check_suite.head_sha }}
      target_repository: ${{ github.event.pull_request.head.repo.full_name || github.event.check_run.pull_requests[0].head.repo.full_name || github.event.check_suite.pull_requests[0].head.repo.full_name || github.repository }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
