# Lints are NOT here — they live in Cargo.toml's [workspace.lints], because a
# [target.*] rustflags key replaces [build].rustflags instead of merging, which
# silently disabled the whole wall for any target with its own stanza.
# Only flags that cannot be expressed as lints belong in this file.

[registries.crates-io]
protocol = "sparse"

# Bionic carries no compiler-rt builtins, so vendored LuaJIT cannot link
# __clear_cache without them. Safe as a target stanza now: it shadows no lints.
[target.aarch64-linux-android]
rustflags = ["-C", "link-args=-lclang_rt.builtins-aarch64-android"]
